# ============================================================
# CINE CINEMA - SHARED KAFKA BROKER
# ============================================================
#
# Cinema Computer:
#   Hostname: ISA-DSAMPATH
#   IP:       10.20.11.179
#   Backend:  8082
#
# Fan Computer:
#   Hostname: ISA-IGARAVI
#   IP:       10.20.11.143
#   Backend:  8080
#
# Kafka Broker:
#   Runs on the Cinema computer
#   Accessible from both computers on port 9092
#
# Architecture:
#   Cinema Backend ----+
#                      |
#                      v
#                SHARED KAFKA
#                      ^
#                      |
#   Fan Backend -------+
#
# ============================================================

name: cine-cinema-kafka

services:

  kafka:

    # Official Apache Kafka Docker image
    image: apache/kafka:4.3.2

    # Docker container name
    container_name: cine-kafka

    # Kafka container hostname
    hostname: kafka

    # Automatically restart Kafka unless manually stopped
    restart: unless-stopped

    # Expose Kafka to both computers through port 9092
    ports:
      - "9092:9092"

    environment:

      # ------------------------------------------------------
      # 1. KRAFT CONFIGURATION
      # ------------------------------------------------------

      # Unique ID of this Kafka node
      KAFKA_NODE_ID: "1"

      # Single container works as broker and controller
      KAFKA_PROCESS_ROLES: "broker,controller"

      # Controller node address
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      # Controller communication listener
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # ------------------------------------------------------
      # 2. NETWORK LISTENERS
      # ------------------------------------------------------

      # INTERNAL:
      # Used by Kafka clients inside the Docker network
      #
      # EXTERNAL:
      # Used by Cinema and Fan backends on the LAN
      #
      # CONTROLLER:
      # Used for Kafka KRaft controller communication

      KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093"

      # Addresses advertised to Kafka clients
      #
      # INTERNAL:
      # kafka:19092
      #
      # EXTERNAL:
      # 10.20.11.179:9092
      #
      # KAFKA_LAN_HOST is read from the root .env file

      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,EXTERNAL://${KAFKA_LAN_HOST:?KAFKA_LAN_HOST is required}:9092"

      # Use plaintext communication for local development
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"

      # Kafka broker-to-broker communication
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      # ------------------------------------------------------
      # 3. SINGLE BROKER CONFIGURATION
      # ------------------------------------------------------

      # Only one Kafka broker exists in this project
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

      # Kafka share group coordinator settings
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"

      # Default number of partitions
      KAFKA_NUM_PARTITIONS: "1"

      # Reduce initial consumer-group rebalance delay
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

      # ------------------------------------------------------
      # 4. TOPIC CONFIGURATION
      # ------------------------------------------------------

      # Prevent Kafka from automatically creating topics
      #
      # We will explicitly create:
      #   cinema.catalog
      #   reservation.requests
      #   reservation.results

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # ------------------------------------------------------
      # 5. DATA STORAGE
      # ------------------------------------------------------

      # Kafka message logs and metadata directory
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

    # Persistent storage for Kafka data
    volumes:
      - kafka_data:/var/lib/kafka/data


# ============================================================
# DOCKER VOLUMES
# ============================================================

volumes:

  # Preserves Kafka topics, messages and metadata
  kafka_data:
