# Application name displayed in Spring Boot logs and monitoring endpoints
spring.application.name=cinema-backend

# Optionally load key=value pairs from ../.env at startup so local secrets (DB credentials,
# JWT_SECRET) stay outside version-controlled properties files
spring.config.import=optional:file:../.env[.properties]
# Backend server port (distinct from the customer-side service port)
server.port=8082

# PostgreSQL connection using environment variables defined in .env
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration: disable Hibernate auto-DDL so schema.sql remains the single source of truth
spring.jpa.hibernate.ddl-auto=none

# Disable automatic Spring Boot schema.sql execution at startup (tables are managed externally/manually)
spring.sql.init.mode=never

# Movie poster upload limits: 2MB per file (matches MoviePosterService) and 3MB total multipart request
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# JWT signing key (Base64-encoded, >= 32 bytes) and token lifetime in milliseconds (3,600,000 ms = 1 hour)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000